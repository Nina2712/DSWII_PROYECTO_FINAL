<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="MediCita: reserva y gestión de citas médicas">
  <title>MediCita · Panel de citas</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/reserva.css">
  <link rel="stylesheet" href="/css/hero.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo
    (function () {
      try {
        var t = localStorage.getItem('medicita.tema');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>MediCita necesita JavaScript para mostrar el panel.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>

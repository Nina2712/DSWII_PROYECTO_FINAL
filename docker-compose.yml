services:
  mysql:
    image: mysql:8.4
    container_name: medicita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-medicita}
      MYSQL_USER: ${DB_USER:-medicita}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medicita123}
      TZ: America/Lima
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
